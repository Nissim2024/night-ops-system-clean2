services:

  postgres:
    image: postgres:16
    container_name: nightops-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-nightops_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-nightops_prod}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - nightops

  redis:
    image: redis:7-alpine
    container_name: nightops-redis-prod
    restart: unless-stopped
    volumes:
      - redis_prod_data:/data
    networks:
      - nightops

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nightops-backend-prod
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER:-nightops_user}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-nightops_prod}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3000
      NODE_ENV: production
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_EMAIL: ${VAPID_EMAIL}
      LDAP_ENABLED: ${LDAP_ENABLED:-false}
      LDAP_URL: ${LDAP_URL:-}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
    ports:
      - "3000:3000"
    networks:
      - nightops

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nightops-frontend-prod
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - nightops

networks:
  nightops:
    driver: bridge

volumes:
  postgres_prod_data:
  redis_prod_data:
