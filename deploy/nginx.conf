# DeployCenter — Nginx Configuration
# שנה את server_name לכתובת שלך

server {
    listen 80;
    server_name deploycenter.yourcompany.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name deploycenter.yourcompany.com;

    # SSL — שנה לנתיבים הנכונים של תעודות ה-SSL שלך
    ssl_certificate     /etc/ssl/certs/deploycenter.crt;
    ssl_certificate_key /etc/ssl/private/deploycenter.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Frontend — קבצי React סטטיים
    root /var/www/deploycenter/frontend/build;
    index index.html;

    # Backend API
    location /api/ {
        proxy_pass http://localhost:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # WebSocket — חיוני לעדכונים real-time
    location /socket.io/ {
        proxy_pass http://localhost:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # React SPA — כל route מוחזר ל-index.html
    location / {
        try_files $uri /index.html;
    }
}
