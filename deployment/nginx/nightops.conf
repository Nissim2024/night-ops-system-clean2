# ============================================================
#  NightOps — Nginx Site Config
#  מקום: /etc/nginx/conf.d/nightops.conf
#  upstream נשלט ע"י nightops-upstream.conf (מוחלף בזמן switch)
# ============================================================

include /etc/nginx/conf.d/nightops-upstream.conf;

server {
    listen 80;
    server_name _;

    # ── Security headers ─────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN"           always;
    add_header X-Content-Type-Options "nosniff"       always;
    add_header X-XSS-Protection "1; mode=block"       always;
    add_header Referrer-Policy "strict-origin"        always;

    # ── Gzip ─────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # ── Backend API ──────────────────────────────────────────
    location /api/ {
        proxy_pass         http://nightops_backend/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    # ── WebSocket (Socket.IO events) ─────────────────────────
    location /socket.io/ {
        proxy_pass         http://nightops_backend/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_read_timeout 3600s;
    }

    # ── Health probe (bypass — direct to active backend) ─────
    location /health {
        proxy_pass http://nightops_backend/health;
        access_log off;
    }

    # ── Frontend (React SPA) ─────────────────────────────────
    location / {
        proxy_pass         http://nightops_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;

        # SPA fallback
        proxy_intercept_errors on;
        error_page 404 = @frontend_fallback;
    }

    location @frontend_fallback {
        proxy_pass http://nightops_frontend;
    }
}
