services:

  backend-blue:
    image: DeployCenter-backend:${APP_VERSION:-latest}-blue
    container_name: DeployCenter-backend-blue
    restart: unless-stopped
    env_file: .env.blue
    environment:
      PORT: "3010"
      NODE_ENV: production
      SLOT: blue
    ports:
      - "127.0.0.1:3010:3010"
    networks:
      - DeployCenter-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3010/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend-blue:
    image: DeployCenter-frontend:${APP_VERSION:-latest}
    container_name: DeployCenter-frontend-blue
    restart: unless-stopped
    ports:
      - "127.0.0.1:3011:80"
    networks:
      - DeployCenter-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  DeployCenter-net:
    external: true
    name: DeployCenter-net
