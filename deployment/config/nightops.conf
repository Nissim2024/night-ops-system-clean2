# ============================================================
#  DeployCenter — Blue/Green Deployment Configuration
#  נטען ע"י כל הסקריפטים
# ============================================================

# ── Slots ────────────────────────────────────────────────────
BLUE_BACKEND_PORT=3010
BLUE_FRONTEND_PORT=3011
GREEN_BACKEND_PORT=3012
GREEN_FRONTEND_PORT=3013

# ── Paths ────────────────────────────────────────────────────
DEPLOY_BASE=/opt/DeployCenter
STATE_FILE=/opt/DeployCenter/state/active_slot
BACKUP_DIR=/opt/DeployCenter/backups
LOG_DIR=/opt/DeployCenter/logs
NGINX_UPSTREAM_CONF=/etc/nginx/conf.d/DeployCenter-upstream.conf
NGINX_SITE_CONF=/etc/nginx/conf.d/DeployCenter.conf

# ── Timing ───────────────────────────────────────────────────
HEALTH_RETRIES=12        # כמה פעמים לנסות health check
HEALTH_INTERVAL=5        # שניות בין ניסיונות
GRACE_PERIOD=120         # שניות שהגרסה הישנה נשמרת אחרי switch

# ── Backup retention ─────────────────────────────────────────
BACKUP_KEEP_DAYS=14

# ── Repo ─────────────────────────────────────────────────────
GIT_REPO=https://github.com/Nissim2024/night-ops-system-clean2.git
