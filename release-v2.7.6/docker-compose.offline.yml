###############################################################################
# DeployCenter 2.7.6 — Production docker-compose
# RHEL 9.7 + Docker Engine 26 + PostgreSQL 16 + Oracle 11g
#
# Before starting:
#   1. Copy this file to the deployment directory
#   2. Create .env file (see .env.example below or UPGRADE-GUIDE.md)
#   3. Mount Oracle Client libs (required for Oracle 11g)
#   4. Mount SMB share for QC releases file (optional)
#   5. docker compose -f docker-compose.offline.yml up -d
###############################################################################
#
# .env.example (create as .env in same directory):
#
#   DB_PASSWORD=StrongPasswordHere
#   JWT_SECRET=your-long-random-jwt-secret-here
#   CORS_ORIGINS=http://your-server-ip
#
#   # Oracle Thick Mode (required for Oracle 11g)
#   ORACLE_LIB_DIR=/oracle/lib
#
#   # Data migration (optional — path inside container)
#   SEED_DATA_FILE=/data/deploycenter-data-export.json
#
#   # Initial admin seed (used only if DB has no users and SEED_DATA_FILE is not set)
#   ADMIN_EMAIL=admin@company.com
#   ADMIN_PASSWORD=ChangeMe123!
#   ADMIN_NAME=Admin
#
#   # QC Releases file (SMB mount)
#   QC_RELEASES_FILE=/mnt/qc-releases/cr_list.xls
#
###############################################################################

services:

  postgres:
    image: postgres:16-alpine
    container_name: dc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     dcuser
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB:       deploycenter
    volumes:
      # Named volume — data persists across upgrades. Never delete this volume.
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dc-net
    healthcheck:
      test:         ["CMD-SHELL", "pg_isready -U dcuser -d deploycenter"]
      interval:     5s
      timeout:      3s
      retries:      10
      start_period: 15s

  api:
    image: deploycenter-api:2.7.6
    container_name: dc-api
    restart: unless-stopped
    pull_policy: never
    environment:
      NODE_ENV:     prod
      PORT:         3000
      DATABASE_URL: postgresql://dcuser:${DB_PASSWORD}@dc-postgres:5432/deploycenter
      JWT_SECRET:   ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}

      # Disable Prisma update-check ping (checkpoint.prisma.io) — required for offline servers
      CHECKPOINT_DISABLE: "1"
      PRISMA_DISABLE_WARNINGS: "1"

      # Oracle Thick Mode — required for Oracle 11g (NJS-138 fix)
      # Mount the Oracle Client library directory and full client home below.
      ORACLE_LIB_DIR:    ${ORACLE_LIB_DIR:-/oracle/lib}
      LD_LIBRARY_PATH:   ${ORACLE_LIB_DIR:-/oracle/lib}
      ORACLE_HOME:       ${ORACLE_HOME:-/oracle/client}

      # QC Releases file path inside the container (SMB mount)
      QC_RELEASES_FILE: ${QC_RELEASES_FILE:-}

      # Data migration on first boot (Option C: import from export-data.ts output)
      SEED_DATA_FILE: ${SEED_DATA_FILE:-}

      # Initial admin user (only created if DB has no users and SEED_DATA_FILE is not set)
      ADMIN_EMAIL:    ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME:     ${ADMIN_NAME:-Admin}

    volumes:
      # Oracle Client — full installation directory (required for ORACLE_HOME + timezone files)
      # Source: /DeployCenter/oracle/product/19.0.0/client_1
      - /DeployCenter/oracle/product/19.0.0/client_1:/oracle/client:ro
      # Oracle Client lib directory (subset — libclntsh.so, libnnz19.so, etc.)
      - /DeployCenter/oracle/product/19.0.0/client_1/lib:/oracle/lib:ro

      # SMB/CIFS mount for QC releases file (mount on host first, then expose here).
      # Host mount: mount -t cifs "//hot-public-01/public/qa/automation/powerbi/releases"
      #             /mnt/qc-releases -o username=USER,password=PASS,domain=HOT
      - /mnt/qc-releases:/mnt/qc-releases:ro

      # Data migration file (generated by export-data.ts on old server)
      # Copy deploycenter-data-export.json to /opt/deploycenter/ on this host
      - /opt/deploycenter:/data:ro

    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dc-net

  frontend:
    image: deploycenter-frontend:2.7.6
    container_name: dc-frontend
    restart: unless-stopped
    pull_policy: never
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - dc-net

networks:
  dc-net:
    driver: bridge

volumes:
  # Named volume — PostgreSQL data persists across container upgrades.
  # To backup: docker run --rm -v postgres_data:/data -v $(pwd):/backup alpine
  #            tar czf /backup/postgres-backup.tar.gz /data
  postgres_data:
