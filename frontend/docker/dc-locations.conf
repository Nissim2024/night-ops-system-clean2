# Shared routes — included by the HTTP server, or by the HTTPS server when a
# certificate is mounted (see 40-dc-runtime.sh).
root /usr/share/nginx/html;
index index.html;

# Backend API — מעביר ל-container של ה-backend
location /api/ {
    proxy_pass         http://api:3000/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}

# WebSocket — Socket.io
location /socket.io/ {
    proxy_pass         http://api:3000/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade    $http_upgrade;
    proxy_set_header   Connection "upgrade";
    proxy_set_header   Host       $host;
    proxy_read_timeout 3600s;
}

# Runtime environment marker (prod / test) — never cached
location = /env-config.js {
    add_header Cache-Control "no-store";
}

# React SPA
location / {
    try_files $uri $uri/ /index.html;
}

gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
